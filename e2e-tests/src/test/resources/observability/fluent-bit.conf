[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Path              /var/log/ballerina/*/app.log
    Parser            bal_logfmt_parser
    Tag               bi
    Read_from_Head    On
    Refresh_Interval  1
    Path_Key          log_file_path

[INPUT]
    Name              tail
    Path              /e2e/mi-runtime/*/repository/logs/wso2carbon*.log
    Parser            mi_log_parser
    Tag               mi
    Read_from_Head    On
    Refresh_Interval  1
    Path_Key          log_file_path

[FILTER]
    Name    lua
    Match   mi
    Script  /fluent-bit/etc/scripts.lua
    Call    enrich_mi_logs

[OUTPUT]
    Name opensearch
    Match bi
    Host host.docker.internal
    Port {{OPENSEARCH_PORT}}
    HTTP_User admin
    HTTP_Passwd Ballerina@123
    Logstash_Format On
    Logstash_DateFormat %Y-%m-%d
    Logstash_Prefix ballerina-application-logs
    Replace_Dots On
    Suppress_Type_Name On
    tls On
    tls.verify Off
    Trace_Error On

[OUTPUT]
    Name opensearch
    Match mi
    Host host.docker.internal
    Port {{OPENSEARCH_PORT}}
    HTTP_User admin
    HTTP_Passwd Ballerina@123
    Logstash_Format On
    Logstash_DateFormat %Y-%m-%d
    Logstash_Prefix mi-application-logs
    Replace_Dots On
    Suppress_Type_Name On
    tls On
    tls.verify Off
    Trace_Error On
